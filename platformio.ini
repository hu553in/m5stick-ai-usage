[platformio]
src_dir = firmware/src

[env:m5stickc-plus2]
platform = espressif32@8.0.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
upload_speed = 921600
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0
; Restore warnings disabled or downgraded by Arduino for project sources.
; Keep inherited -Wno-unused-parameter: ESP32/M5 inline headers trigger it.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Werror=unused-function
    -Werror=unused-variable
    -Werror=unused-but-set-variable
    -Werror=deprecated-declarations
    -Wsign-compare
    -Wframe-address
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    bblanchon/ArduinoJson@7.4.3
